<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdeef3">
<title>ตำแหน่งที่นั่ง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@600;800&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
[data-s="เจ้าสาว"]{--sc:#ad4568;--sbg:#fff5f8;--sline:#f5cfdc}
[data-s="เจ้าบ่าว"]{--sc:#2f5f9e;--sbg:#f2f7ff;--sline:#cddcf3}
:root{color-scheme:light;--card:#fff;--ink:#4a3b45;--mute:#6b5765;--line:#f0d9e2;--accent:#ad4568;--ok:#2f7a5b;--okbg:#e6f6ee;--shadow:0 2px 6px rgba(217,112,143,.08),0 8px 24px rgba(180,140,200,.1)}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:linear-gradient(160deg,#fdeef3 0%,#f3eafc 45%,#e8f6f1 100%) fixed;color:var(--ink);font-family:Prompt,system-ui,sans-serif;line-height:1.5;padding:0 12px 40px}
.wrap{max-width:1100px;margin:0 auto}
header{padding:20px 4px 12px;display:flex;align-items:center;gap:12px}
header a{color:var(--accent);text-decoration:none;font-weight:500;font-size:14px;white-space:nowrap}
h1{font-family:Kanit,sans-serif;font-weight:800;color:#a8426a;font-size:clamp(20px,5.6vw,26px);flex:1;white-space:nowrap}
.cfg-btn{font:inherit;font-size:14px;font-weight:500;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.views{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;border-radius:14px;background:rgba(255,255,255,.6);border:1px solid var(--line);margin-bottom:14px}
.views button{font:inherit;font-weight:600;font-size:15px;padding:10px;border:0;border-radius:10px;background:transparent;color:var(--mute);cursor:pointer}
.views button[aria-selected="true"]{background:#fff;color:#a8426a;box-shadow:0 1px 4px rgba(74,59,69,.12)}
.tools{display:flex;gap:8px;margin-bottom:10px}
.tools input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.tools select{font:inherit;font-size:15px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.pg{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;padding:12px 14px;margin-bottom:8px;border-radius:14px;background:var(--sbg);border:1px solid var(--sline);border-left:5px solid var(--sc);cursor:pointer}
.pg .t{flex:1;min-width:0}
.pg .t div{font-weight:600;white-space:pre-line}
.pg .t small{color:var(--mute);font-size:13px}
.pg .pos{flex:none;text-align:right;font-family:Kanit,sans-serif;font-weight:600;color:var(--sc);font-size:15px;line-height:1.3}
.pg .pos small{display:block;font-family:Prompt,sans-serif;font-weight:400;color:var(--mute);font-size:12px}
.empty{text-align:center;color:var(--mute);padding:24px 0}
.seat.hl{outline:3px solid #e0a800;outline-offset:2px;animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{outline-color:transparent}}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--mute);margin-bottom:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px;border:1px solid var(--line);background:#fff}
.legend i.in{background:var(--okbg);border-color:#8fd0ae}
.stage{text-align:center;font-family:Kanit,sans-serif;font-weight:600;font-size:18px;letter-spacing:.2em;color:#fff;background:linear-gradient(90deg,#a8426a,#6d4fa8);border-radius:14px 14px 40px 40px;padding:14px;box-shadow:var(--shadow)}
.hall{display:grid;grid-template-columns:1fr 18px 1fr;gap:6px;margin-top:16px;align-items:start}
.aisle{align-self:stretch;border-left:2px dashed var(--line);margin-left:8px}
.side h2{font-family:Kanit,sans-serif;font-weight:600;font-size:15px;color:var(--sc);text-align:center;margin-bottom:8px}
.side h2 small{display:block;font-family:Prompt,sans-serif;font-weight:400;font-size:12px;color:var(--mute)}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;gap:5px;grid-auto-rows:clamp(46px,8.5vw,74px)}
.seat{grid-row:1;container-type:inline-size;min-width:0;border-radius:10px;background:var(--sbg);border:1.5px solid var(--sline);padding:4px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;font:inherit;color:inherit}
.seat b{font-family:Kanit,sans-serif;font-weight:600;font-size:clamp(13px,2.4vw,17px);color:var(--sc);line-height:1.1}
.seat span{font-size:clamp(9px,1.5vw,12px);line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;margin-top:2px}
@container (max-width:54px){.seat span{display:none}}
.seat.in{background:var(--okbg);border-color:#8fd0ae}
.seat.in b{color:var(--ok)}
.seat small{font-size:11px;color:var(--mute)}
.seat.multi{background-image:repeating-linear-gradient(90deg,transparent 0 calc(var(--w) - 1px),var(--sline) calc(var(--w) - 1px) var(--w))}
.seat.in.multi{background-image:repeating-linear-gradient(90deg,transparent 0 calc(var(--w) - 1px),#bfe5d1 calc(var(--w) - 1px) var(--w))}
.seat.guest{border-style:dashed;border-width:2px}
.seat.empty{background:transparent;border-style:dashed;cursor:default}
.over{margin-top:18px;padding:12px 14px;border-radius:14px;background:#fff8e6;border:1px solid #f1d58a;font-size:14px}
.status{font-size:12px;color:var(--mute);text-align:center;margin-top:16px}
dialog{margin:auto;border:0;border-radius:18px;padding:22px;width:min(92vw,420px);color:var(--ink);box-shadow:0 20px 60px rgba(74,59,69,.3)}
dialog::backdrop{background:rgba(74,59,69,.35)}
dialog h2{font-family:Kanit,sans-serif;font-weight:600;font-size:20px;white-space:pre-line;line-height:1.3}
dialog p{color:var(--mute);font-size:14px;margin-top:4px}
dialog .tag{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;color:var(--sc);border:1px solid var(--sline);background:var(--sbg);border-radius:99px;padding:2px 12px}
dialog .ok{color:var(--ok);font-weight:600;margin-top:8px}
dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
dialog button{font:inherit;font-weight:600;font-size:15px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
dialog button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.cfg{display:grid;gap:14px;margin-top:12px}
.cfg fieldset{border:1px solid var(--sline);border-radius:12px;padding:10px 12px}
.cfg legend{font-weight:600;color:var(--sc);padding:0 6px}
.step{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.step div{display:flex;align-items:center;gap:8px}
.step button{width:40px;height:40px;padding:0;font-size:20px}
.step output{min-width:28px;text-align:center;font-family:Kanit,sans-serif;font-weight:600;font-size:18px}
.cfg small{color:var(--mute);font-size:12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header><a href="../">← หน้าหลัก</a><h1>ตำแหน่งที่นั่ง</h1><button class="cfg-btn" id="cfgBtn">ตั้งค่าเก้าอี้</button></header>
  <div class="views" role="tablist">
    <button role="tab" data-view="map">ผังที่นั่ง</button>
    <button role="tab" data-view="list">ค้นจากรายชื่อ</button>
  </div>
  <section id="vMap">
    <div class="legend"><span><i></i>ยังไม่มา</span><span><i class="in"></i>มาแล้ว</span><span>แตะเก้าอี้เพื่อดูรายละเอียด</span></div>
    <div class="stage">เวที</div>
    <div class="hall" id="hall"></div>
    <div id="over"></div>
  </section>
  <section id="vList" hidden>
    <div class="tools"><input id="q" type="search" placeholder="ค้นหาชื่อคนที่มาแล้ว" autocomplete="off">
      <select id="fs"><option value="">ทุกฝั่ง</option><option>เจ้าสาว</option><option>เจ้าบ่าว</option></select></div>
    <div id="plist"></div>
  </section>
  <p class="status" id="status"></p>
</div>

<dialog id="info"><h2 id="iName"></h2><p id="iMeta"></p><div id="iTag"></div><div id="iOk"></div>
  <div class="cfg" style="margin-top:14px"><div class="step"><span>จำนวนคน (ใช้เก้าอี้)</span>
    <div><button id="sMinus" aria-label="ลด">−</button><output id="sN"></output><button id="sPlus" aria-label="เพิ่ม">+</button></div></div></div>
  <div class="acts"><button id="iClose">ปิด</button></div></dialog>

<dialog id="cfg"><h2>ตั้งค่าเก้าอี้</h2><p>จำนวนแถว (นับจากหน้าเวที) และเก้าอี้ต่อแถว ของแต่ละฝั่ง — คนที่มาด้วยกันจะนั่งติดกันในแถวเดียว</p>
  <div class="cfg" id="cfgBody"></div>
  <div class="acts"><button id="cfgCancel">ยกเลิก</button><button class="pri" id="cfgSave">บันทึก</button></div></dialog>

<script>
const API = "https://rinnjtfrrkoajknoldoy.supabase.co/rest/v1/rpc/";
const KEY = "sb_publishable_KGScT2bjpcoiDDAJQAUpbA_AnHdXb8S";
// ซ้าย = เจ้าสาว, ขวา = เจ้าบ่าว (มองจากที่นั่งไปทางเวที)
const SIDES = ["เจ้าสาว", "เจ้าบ่าว"];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const short = n => n.split("\n")[0];
const label = n => short(n).replace(/^คุณ\s*/, "");

let guests = [], layout = null, lastOk = 0;

async function rpc(fn, body = {}) {
  const r = await fetch(API + fn, { method: "POST",
    headers: { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json" },
    body: JSON.stringify(body) });
  const d = await r.json().catch(() => null);
  if (!r.ok) throw new Error(d?.message || r.statusText);
  return d;
}

async function load() {
  try {
    [guests, layout] = await Promise.all([rpc("guests_list"), rpc("layout_get")]);
    lastOk = Date.now(); render();
  } catch { $("status").textContent = "เชื่อมต่อไม่ได้ กำลังลองใหม่…"; }
}

// จัดที่นั่งอัตโนมัติตามลำดับในชีต: แถวหน้าสุด (ติดเวที) ก่อน, ในแถวเริ่มจากเก้าอี้ติดทางเดินกลาง
// รายการที่มาหลายคนนั่งติดกันในแถวเดียว ถ้าแถวนั้นเหลือที่ไม่พอจะขึ้นแถวใหม่
// ถ้าฝั่งไหนเก้าอี้ไม่พอ คนที่เหลือจะไปนั่งที่ว่างของอีกฝั่ง (ต่อท้ายแถวหลัง)
const other = s => s === SIDES[0] ? SIDES[1] : SIDES[0];
function fill(area, list) {
  const { rows, cols } = layout[area.side], left = [];
  for (const g of list) {
    let k = g.seats || 1, r = area.r;
    if (r < rows && k <= cols && cols - area.used[r] < k) r++;
    const mine = [];
    while (k > 0 && r < rows) {
      if (area.used[r] === cols) { r++; continue; }
      const n = Math.min(k, cols - area.used[r]);
      mine.push({ g, area: area.side, r, off: area.used[r], n }); area.used[r] += n; k -= n;
    }
    if (k > 0) { mine.forEach(p => area.used[p.r] -= p.n); left.push(g); continue; }  // ไม่พอ: คืนที่ แล้วไปลองอีกฝั่ง
    area.r = r; area.parts.push(...mine);
  }
  return left;
}
function placeAll() {
  const A = {};
  for (const s of SIDES) A[s] = { side: s, r: 0, used: Array(layout[s].rows).fill(0), parts: [] };
  const lists = Object.fromEntries(SIDES.map(s => [s, guests.filter(g => g.side === s).sort((a, b) => a.seq - b.seq)]));
  const left = Object.fromEntries(SIDES.map(s => [s, fill(A[s], lists[s])]));
  const over = SIDES.flatMap(s => fill(A[other(s)], left[s]));
  const where = new Map();
  for (const s of SIDES) for (const p of A[s].parts) { if (!where.has(p.g.id)) where.set(p.g.id, []); where.get(p.g.id).push(p); }
  return { A, over, where };
}
const posOf = (P, g) => (P.where.get(g.id) || []);
const posStr = ps => ps.map(p => `แถว ${p.r + 1} · ที่ ${p.off + 1}${p.n > 1 ? "–" + (p.off + p.n) : ""}`).join(", ");
const areaName = a => `ฝั่ง${a === SIDES[0] ? "ซ้าย" : "ขวา"} (ฝั่ง${a})`;
// คอลัมน์บนจอ: ฝั่งซ้าย (เจ้าสาว) ทางเดินอยู่ทางขวา จึงนับจากขวา
const colStart = (side, cols, off, n) => side === "เจ้าสาว" ? cols - off - n + 1 : off + 1;

function render() {
  if (!layout) return;
  const P = placeAll();
  const block = area => {
    const { rows, cols } = layout[area], { parts, used } = P.A[area], n = guests.filter(g => g.side === area);
    const need = n.reduce((a, g) => a + (g.seats || 1), 0), guestsHere = parts.filter(p => p.g.side !== area).length;
    const rowsHTML = Array.from({ length: rows }, (_, r) => {
      const mine = parts.filter(p => p.r === r);
      const empties = Array.from({ length: cols - used[r] }, (_, e) => colStart(area, cols, used[r] + e, 1));
      return `<div class="row" style="grid-template-columns:repeat(${cols},1fr)">${mine.map(p => `
        <button class="seat ${p.g.arrived_at ? "in" : ""} ${p.n > 1 ? "multi" : ""} ${p.g.side !== area ? "guest" : ""}" data-id="${p.g.id}" data-s="${esc(p.g.side)}"
          style="grid-column:${colStart(area, cols, p.off, p.n)} / span ${p.n};--w:calc(100% / ${p.n})">
          <b>${p.g.seq}</b><span>${esc(label(p.g.name))}</span>${p.n > 1 ? `<small>${p.n} ที่</small>` : ""}</button>`).join("")}
        ${empties.map(c => `<div class="seat empty" style="grid-column:${c}"></div>`).join("")}</div>`;
    }).join("");
    return `<div class="side" data-s="${esc(area)}">
      <h2>ฝั่ง${esc(area)}<small>มาแล้ว ${n.filter(g => g.arrived_at).length} / ${n.length} รายการ · ${need} คน · ${rows}×${cols} = ${rows * cols} ที่${guestsHere ? ` · มีฝั่ง${esc(other(area))}มานั่ง ${guestsHere}` : ""}</small></h2>
      <div class="rows">${rowsHTML}</div></div>`;
  };
  $("hall").innerHTML = block(SIDES[0]) + `<div class="aisle"></div>` + block(SIDES[1]);
  $("over").innerHTML = P.over.length ? `<div class="over">⚠ เก้าอี้ไม่พอทั้งสองฝั่ง ${P.over.length} รายการ: ${P.over.map(g => `ฝั่ง${esc(g.side)} ${g.seq} ${esc(short(g.name))} (${g.seats} คน)`).join(", ")} — กด "ตั้งค่าเก้าอี้" เพื่อเพิ่ม</div>` : "";
  $("status").textContent = lastOk ? `อัปเดตล่าสุด ${new Date(lastOk).toLocaleTimeString("th-TH")} · รีเฟรชอัตโนมัติ` : "";
  if ($("info").open) fillInfo(P);
  renderList(P);
}

// ---------- แท็บ: ผัง / ค้นจากรายชื่อ ----------
const store = { get: k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
let view = store.get("seat-view") || "map";
function setView(v) {
  view = v; store.set("seat-view", v);
  document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-selected", b.dataset.view === v));
  $("vMap").hidden = v !== "map"; $("vList").hidden = v !== "list";
}
document.querySelector(".views").onclick = e => { const b = e.target.closest("[data-view]"); if (b) setView(b.dataset.view); };

function renderList(P) {
  if (!layout) return;
  P = P || placeAll();
  const q = $("q").value.trim().toLowerCase(), f = $("fs").value;
  const rows = guests.filter(g => g.arrived_at && (!f || g.side === f) && (!q || (g.name + " " + g.relation).toLowerCase().includes(q)))
    .sort((a, b) => SIDES.indexOf(a.side) - SIDES.indexOf(b.side) || a.seq - b.seq);
  $("plist").innerHTML = rows.length ? rows.map(g => `
    <button class="pg" data-s="${esc(g.side)}" data-go="${g.id}">
      <div class="t"><div>${esc(g.name)}</div><small>ฝั่ง${esc(g.side)} ${g.seq}${g.relation ? " · " + esc(g.relation) : ""}${g.seats > 1 ? ` · ${g.seats} คน` : ""}</small></div>
      ${(ps => `<div class="pos">${ps.length ? posStr(ps) : "ยังไม่มีที่นั่ง"}<small>${ps.length ? areaName(ps[0].area) : ""} · นับจากทางเดินกลาง</small></div>`)(posOf(P, g))}
    </button>`).join("") : `<p class="empty">${guests.some(g => g.arrived_at) ? "ไม่พบรายชื่อ" : "ยังไม่มีใครเช็คชื่อว่ามาแล้ว"}</p>`;
}
$("q").oninput = () => renderList(); $("fs").onchange = () => renderList();
// แตะรายชื่อ → ไปที่ผัง แล้วไฮไลต์เก้าอี้
$("plist").onclick = e => {
  const b = e.target.closest("[data-go]"); if (!b) return;
  setView("map");
  const el = document.querySelector(`.seat[data-id="${b.dataset.go}"]`);
  if (el) { el.classList.add("hl"); el.scrollIntoView({ block: "center", behavior: "smooth" }); setTimeout(() => el.classList.remove("hl"), 3200); }
};

let infoId = null;
function fillInfo(P) {
  const g = guests.find(x => x.id === infoId); if (!g) return;
  const ps = posOf(P || placeAll(), g);
  const where = ps.length ? `${areaName(ps[0].area)} · ${posStr(ps)}` : "ยังไม่มีที่นั่ง (เก้าอี้ไม่พอ)";
  $("info").dataset.s = g.side;
  $("iName").textContent = g.name;
  $("iMeta").textContent = [g.relation, `${g.gift} ${g.gift_qty} ชิ้น`, g.note].filter(Boolean).join(" · ");
  $("iTag").innerHTML = `<span class="tag">${esc(g.side)} ${g.seq} · ${where} (นับจากทางเดินกลาง)</span>`;
  $("iOk").innerHTML = g.arrived_at ? `<p class="ok">มาแล้ว ${new Date(g.arrived_at).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" })}</p>` : `<p>ยังไม่ได้เช็คชื่อ</p>`;
  $("sN").textContent = g.seats;
}
$("hall").onclick = e => {
  const b = e.target.closest("[data-id]"); if (!b) return;
  infoId = +b.dataset.id; fillInfo(); $("info").showModal();
};
async function setSeats(d) {
  const g = guests.find(x => x.id === infoId); if (!g) return;
  const v = Math.min(20, Math.max(1, g.seats + d)); if (v === g.seats) return;
  const prev = g.seats; g.seats = v; render();
  try { Object.assign(g, await rpc("guest_seats", { p_id: g.id, p_n: v })); }
  catch { g.seats = prev; alert("บันทึกไม่สำเร็จ ลองอีกครั้ง"); }
  render();
}
$("sMinus").onclick = () => setSeats(-1);
$("sPlus").onclick = () => setSeats(1);
$("iClose").onclick = () => $("info").close();

let draft;
function drawCfg() {
  $("cfgBody").innerHTML = SIDES.map(s => {
    const n = guests.filter(g => g.side === s).reduce((a, g) => a + (g.seats || 1), 0), cap = draft[s].rows * draft[s].cols;
    return `<fieldset data-s="${esc(s)}"><legend>ฝั่ง${esc(s)}</legend>
      ${["rows", "cols"].map(k => `<div class="step"><span>${k === "rows" ? "จำนวนแถว" : "เก้าอี้ต่อแถว"}</span>
        <div><button data-k="${k}" data-side="${esc(s)}" data-d="-1">−</button><output>${draft[s][k]}</output><button data-k="${k}" data-side="${esc(s)}" data-d="1">+</button></div></div>`).join("")}
      <small>${cap} ที่ · ต้องใช้อย่างน้อย ${n} ที่${cap < n ? " — ไม่พอ" : ""}</small></fieldset>`;
  }).join("");
}
$("cfgBtn").onclick = () => { if (!layout) return; draft = structuredClone(layout); drawCfg(); $("cfg").showModal(); };
$("cfgBody").onclick = e => {
  const b = e.target.closest("[data-k]"); if (!b) return;
  const v = draft[b.dataset.side][b.dataset.k] + +b.dataset.d;
  draft[b.dataset.side][b.dataset.k] = Math.min(20, Math.max(1, v)); drawCfg();
};
$("cfgCancel").onclick = () => $("cfg").close();
$("cfgSave").onclick = async () => {
  $("cfgSave").disabled = true;
  try {
    for (const s of SIDES) if (draft[s].rows !== layout[s].rows || draft[s].cols !== layout[s].cols)
      layout = await rpc("layout_set", { p_side: s, p_rows: draft[s].rows, p_cols: draft[s].cols });
    render(); $("cfg").close();
  } catch { alert("บันทึกไม่สำเร็จ ลองอีกครั้ง"); }
  $("cfgSave").disabled = false;
};

setView(view);
document.addEventListener("visibilitychange", () => !document.hidden && load());
load(); setInterval(() => !document.hidden && !$("cfg").open && load(), 4000);
</script>
</body>
</html>
