<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#faf8f5">
<title>งานแต่ง อั๋น กอล์ฟ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f5;--card:#fff;--ink:#1f1d1a;--mute:#6f6a63;--line:#e8e3dc;--accent:#8a6a45;--shadow:0 1px 2px rgba(31,29,26,.05),0 4px 16px rgba(31,29,26,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#161513;--card:#1f1e1b;--ink:#f1eee9;--mute:#a39d94;--line:#2f2d29;--accent:#c9a67c;--shadow:0 1px 2px rgba(0,0,0,.3)}}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;line-height:1.6;padding:72px 16px 56px}
.wrap{max-width:880px;margin:0 auto}
header{text-align:center;margin-bottom:48px}
.eyebrow{font-size:13px;font-weight:500;letter-spacing:.2em;color:var(--accent);text-transform:uppercase}
h1{font-family:"Noto Serif Thai",serif;font-weight:600;font-size:clamp(34px,7vw,56px);line-height:1.2;margin-top:10px;letter-spacing:-.01em}
.sub{color:var(--mute);margin-top:10px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:6px;padding:22px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
a.card:hover,a.card:focus-visible{border-color:var(--accent);transform:translateY(-2px);outline:none}
.card h2{font-size:18px;font-weight:600}
.card p{color:var(--mute);font-size:14px;flex:1}
.go{margin-top:8px;font-size:14px;font-weight:500;color:var(--accent)}
.card.soon{box-shadow:none;border-style:dashed;opacity:.6}
footer{text-align:center;color:var(--mute);font-size:13px;margin-top:48px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Wedding</p>
    <h1>งานแต่ง อั๋น กอล์ฟ</h1>
    <p class="sub">เลือกเมนูที่ต้องการ</p>
  </header>
  <main class="grid" id="grid"></main>
</div>
<script>
// เพิ่มเมนูใหม่ที่นี่: { title, desc, href } — ไม่ใส่ href = แสดงเป็น "เร็วๆ นี้"
const FEATURES = [
  { title: "เกมทายเพลง", desc: "เกมทายชื่อเพลงจากเนื้อร้อง สำหรับเล่นบนเวที", href: "game/" },
];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
document.getElementById("grid").innerHTML = FEATURES.map(f => f.href
  ? `<a class="card" href="${esc(f.href)}"><h2>${esc(f.title)}</h2><p>${esc(f.desc)}</p><span class="go">เปิด →</span></a>`
  : `<div class="card soon"><h2>${esc(f.title)}</h2><p>${esc(f.desc)}</p><span class="go">เร็วๆ นี้</span></div>`
).join("");
</script>
</body>
</html>
