<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12072b">
<title>ME Wedding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@600;800;900&family=Prompt:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#12072b;--bg2:#2b0b63;--ink:#fff;--mute:#b7a6ea;--gold:#ffd23f;--pink:#ff3fa4;--cyan:#33e6ff;--panel:rgba(255,255,255,.07);--line:rgba(183,166,234,.25)}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 110%,#5b1aa8 0%,var(--bg2) 35%,var(--bg) 75%) fixed;color:var(--ink);font-family:Prompt,sans-serif;padding:56px 16px 48px}
.wrap{max-width:960px;margin:0 auto}
header{text-align:center;margin-bottom:40px}
.num{font-family:Kanit,sans-serif;font-weight:600;letter-spacing:.35em;color:var(--cyan);text-shadow:0 0 12px rgba(51,230,255,.7);font-size:clamp(13px,2vw,18px)}
h1{font-family:Kanit,sans-serif;font-weight:900;font-size:clamp(44px,9vw,96px);line-height:1.05;margin-top:8px;
 background:linear-gradient(180deg,#fff7c2 0%,var(--gold) 45%,#ff8a1f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 5px 0 #8a1d5a) drop-shadow(0 0 26px rgba(255,63,164,.5))}
.sub{color:var(--mute);margin-top:14px;font-size:clamp(15px,2vw,19px)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,320px));justify-content:center;gap:18px}
.card{display:flex;flex-direction:column;gap:10px;padding:24px;border-radius:22px;background:var(--panel);border:2px solid var(--line);color:inherit;text-decoration:none;transition:transform .15s,border-color .15s,box-shadow .15s}
a.card:hover,a.card:focus-visible{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 0 30px rgba(255,210,63,.35);outline:none}
.icon{font-size:40px;line-height:1;color:var(--gold)}
.card h2{font-family:Kanit,sans-serif;font-weight:800;font-size:24px}
.card p{color:var(--mute);font-size:15px;line-height:1.5;flex:1}
.go{font-weight:600;color:var(--cyan)}
.links{display:flex;gap:14px;flex-wrap:wrap}
.links a{color:var(--cyan);font-weight:600;text-decoration:none}
.links a:hover{text-decoration:underline}
.card.soon{opacity:.45;border-style:dashed}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="num">WEDDING</p>
    <h1>ME Wedding</h1>
    <p class="sub">เลือกสิ่งที่ต้องการใช้ในงาน</p>
  </header>
  <main class="grid" id="grid"></main>
</div>
<script>
// เพิ่ม feature ใหม่ที่นี่: { icon, title, desc, href, links? } — ไม่มี href = "เร็วๆ นี้"
const FEATURES = [
  { icon: "♪", title: "เกมทายเพลง", desc: "บอทอ่านเนื้อเพลง แขกทายชื่อเพลง แล้วเฉลยพร้อมเปิดเพลงจาก YouTube",
    href: "game/", links: [["จอเกม", "game/"], ["รีโมต", "game/remote.html"]] },
];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
document.getElementById("grid").innerHTML = FEATURES.map(f => f.links
  ? `<div class="card"><div class="icon">${esc(f.icon)}</div><h2>${esc(f.title)}</h2><p>${esc(f.desc)}</p>
      <div class="links">${f.links.map(([t, h]) => `<a href="${esc(h)}">${esc(t)} →</a>`).join("")}</div></div>`
  : f.href
  ? `<a class="card" href="${esc(f.href)}"><div class="icon">${esc(f.icon)}</div><h2>${esc(f.title)}</h2><p>${esc(f.desc)}</p><span class="go">เปิด →</span></a>`
  : `<div class="card soon"><div class="icon">${esc(f.icon)}</div><h2>${esc(f.title)}</h2><p>${esc(f.desc)}</p><span class="go">เร็วๆ นี้</span></div>`
).join("");
</script>
</body>
</html>
