<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fdeef3">
<title>งานแต่ง อั๋น กอล์ฟ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@600;800&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--card:#fff;--ink:#4a3b45;--mute:#6b5765;--line:#f3dbe4;--accent:#ad4568;--shadow:0 2px 6px rgba(217,112,143,.08),0 10px 30px rgba(180,140,200,.12)}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:linear-gradient(160deg,#fdeef3 0%,#f3eafc 45%,#e8f6f1 100%) fixed;color:var(--ink);font-family:Prompt,system-ui,sans-serif;line-height:1.6;padding:72px 16px 56px}
.wrap{max-width:880px;margin:0 auto}
header{text-align:center;margin-bottom:48px}
h1{font-family:Kanit,sans-serif;font-weight:800;color:#c25579;font-size:clamp(34px,7vw,56px);line-height:1.2;letter-spacing:-.01em}
.sub{color:var(--mute);margin-top:10px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:6px;padding:22px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
a.card:hover,a.card:focus-visible{border-color:var(--accent);transform:translateY(-2px);outline:none}
.card h2{font-family:Kanit,sans-serif;font-size:19px;font-weight:600}
.card:nth-child(4n+1){background:#fff5f8}.card:nth-child(4n+2){background:#f7f2ff}.card:nth-child(4n+3){background:#f0faf6}.card:nth-child(4n){background:#fffaf0}
.card p{color:var(--mute);font-size:14px;flex:1}
.go{margin-top:8px;font-size:14px;font-weight:500;color:var(--accent)}
.card.soon{box-shadow:none;border-style:dashed;opacity:.6}
footer{text-align:center;color:var(--mute);font-size:13px;margin-top:48px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>งานแต่ง อั๋น กอล์ฟ</h1>
    <p class="sub">เลือกเมนูที่ต้องการ</p>
  </header>
  <main class="grid" id="grid"></main>
</div>
<script>
// เพิ่มเมนูใหม่ที่นี่: { title, desc, href } — ไม่ใส่ href = แสดงเป็น "เร็วๆ นี้"
const FEATURES = [
  { title: "เกมทายเพลง", desc: "เกมทายชื่อเพลงจากเนื้อร้อง สำหรับเล่นบนเวที", href: "game/" },
];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
document.getElementById("grid").innerHTML = FEATURES.map(f => f.href
  ? `<a class="card" href="${esc(f.href)}"><h2>${esc(f.title)}</h2><p>${esc(f.desc)}</p><span class="go">เปิด →</span></a>`
  : `<div class="card soon"><h2>${esc(f.title)}</h2><p>${esc(f.desc)}</p><span class="go">เร็วๆ นี้</span></div>`
).join("");
</script>
</body>
</html>
